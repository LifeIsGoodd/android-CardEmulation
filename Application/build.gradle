
buildscript {
    repositories {
        jcenter()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.0.1'
    }
}

apply plugin: 'com.android.application'

repositories {
    jcenter()
    google()
}

dependencies {
    compile "com.android.support:support-v4:27.0.2"
    compile "com.android.support:support-v13:27.0.2"
    compile "com.android.support:cardview-v7:27.0.2"
    compile "com.android.support:appcompat-v7:27.0.2"
}

// The sample build uses multiple directories to
// keep boilerplate and common code separate from
// the main sample code.
List<String> dirs = [
    'main',     // main sample code; look here for the interesting stuff.
    'common',   // components that are reused by multiple samples
    'template'] // boilerplate code that is generated by the sample template process

android {
    // если мы просто поднимем эти цифры до максимума в текущем старом проекте, наш древний облачный сборщик Gradle 4.4 выдаст критическую ошибку, 
    // так как он физически не умеет работать с современными инструментами сборки (Build Tools 34).Чтобы решить эту проблему элегантно и без долгого обновления всего проекта,
    // мы поднимем планку до Android 10 (API 29). Для современной операционной системы вашего смартфона этого будет абсолютно достаточно, чтобы полностью убрать белое предупреждение,
    // и при этом старый Gradle 4.4 сможет успешно переварить такую сборку.
    // Поднимаем версию компилятора до API 29 (Android 10)
    compileSdkVersion 29 //27

    // Указываем стабильные инструменты сборки для этой версии
    buildToolsVersion "29.0.3"  //"27.0.2"

    defaultConfig {
        minSdkVersion 19
        // Поднимаем целевую версию до API 29 — этого хватит, чтобы убрать окно
        targetSdkVersion 29 //27

        // Задайте вашу версию здесь:
        versionCode 2
        versionName "2.1-HEX-Safe"        
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    sourceSets {
        main {
            dirs.each { dir ->
                java.srcDirs "src/${dir}/java"
                res.srcDirs "src/${dir}/res"
            }
        }
        androidTest.setRoot('tests')
        androidTest.java.srcDirs = ['tests/src']

    }

}
